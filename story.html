<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <script>
      try {
        if (!localStorage.getItem("ghostEntered"))
          location.replace("login.html");
      } catch (e) {}
    </script>
    <title>Story · Neo Universe</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Source+Serif+4:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      html {
        scroll-behavior: smooth;
      }

      /* 1. 去掉原有 section 的顶部留白，让全屏视频顶到屏幕最上方 */
      body > section#story {
        padding: 0 !important;
        max-width: 100% !important;
        margin: 0 !important;
      }

      /* 隐藏原有的小标题，保持首屏纯净全屏 */
      #story > .sec,
      #story > .sub {
        display: none;
      }

      /* 2. 改为上下纵向布局，不再左右分栏 */
      #stg.stg {
        display: flex !important;
        flex-direction: column !important;
        width: 100%;
        padding: 0 !important;
        border: none !important;
        background: transparent !important;
        box-shadow: none !important;
      }

      /* 3. 首屏 100vh 全屏视频/图片容器 */
      #stpic.stpic {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        border-radius: 0 !important;
        background: #050818;
        overflow: hidden;
      }

      #stpic video,
      #stpic img {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain; /* 完整展示组员视频画面不裁切；如果想铺满不留黑边可改为 cover */
        border-radius: 0 !important;
      }

      /* 年份标签移到左上角导航栏下方，避免遮挡底部进度条 */
      #stpic span {
        pointer-events: none;
        top: 84px !important;
        left: 24px !important;
        bottom: auto !important;
        right: auto !important;
        z-index: 5;
      }

      /* 底部向下滑动引导提示 */
      .scroll-cue {
        position: absolute;
        bottom: 64px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 6;
        padding: 8px 18px;
        border-radius: 999px;
        background: rgba(5, 8, 24, 0.72);
        border: 1px solid rgba(61, 224, 255, 0.45);
        color: var(--cyan, #3de0ff);
        font-family: "Orbitron", sans-serif;
        font-size: 12px;
        letter-spacing: 2px;
        text-decoration: none;
        backdrop-filter: blur(6px);
        animation: bounceCue 2s infinite;
      }

      @keyframes bounceCue {
        0%, 100% { transform: translate(-50%, 0); }
        50% { transform: translate(-50%, 6px); }
      }

      /* 4. 下拉后的文字解释卡片区域 */
      #stx.stx {
        width: min(920px, calc(100% - 32px));
        margin: 56px auto 24px;
        padding: clamp(24px, 4vw, 44px);
        background: rgba(11, 16, 48, 0.88);
        border: 1px solid var(--c, var(--violet, #8c64ff));
        border-radius: 20px;
        box-shadow: 0 0 36px rgba(0, 0, 0, 0.55);
      }

      /* 底部章节切换导航栏居中对齐 */
      #story > .tlnav {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto 72px;
      }
    </style>
  </head>
  <body>
    <canvas id="sky"></canvas>

    <header class="top">
      <b>NEO UNIVERSE</b>
      <a href="index.html">HOME</a>
      <a href="story.html">STORY</a>
      <a href="login.html?logout=1">LOG OUT</a>
    </header>

    <section id="story">
      <h2 class="sec">Story Mode</h2>
      <p class="sub">Seven chapters, seven generations, one mission.</p>

      <div class="stg" id="stg">
        <!-- 首屏全屏区域 -->
        <div style="position: relative; width: 100%;">
          <div class="stpic" id="stpic"></div>
          <a href="#stx" class="scroll-cue">SCROLL DOWN FOR STORY ▾</a>
        </div>

        <!-- 下拉后才看到的解释区域 -->
        <div class="stx" id="stx">
          <div class="stgen" id="stgen"></div>
          <h3 id="sttitle"></h3>
          <p id="sttext"></p>
          <div class="chips" id="stlinks"></div>
          <div class="row">
            <button class="btn pk" id="stsay">🔊 READ ALOUD</button>
          </div>
          <div class="stmis" id="stmis"></div>
        </div>
      </div>

      <div class="tlnav">
        <button class="btn alt" id="stPrev">◂ PREV</button>
        <div class="prog"><i id="stprog"></i></div>
        <button class="btn alt" id="stNext">NEXT ▸</button>
      </div>
    </section>

    <div id="toast"></div>

    <!-- 3D 模型弹窗 -->
    <div id="modal" aria-modal="true" role="dialog">
      <div class="mbox" id="mbox">
        <div class="mhead">
          <h3 id="mtitle"></h3>
          <button class="btn alt" id="mclose">CLOSE ✕</button>
        </div>
        <div class="mgrid">
          <div id="cv">
            <div class="cvh">Drag to rotate · click a part</div>
          </div>
          <div class="mside">
            <div class="row">
              <button class="btn pk" id="speak">
                🔊 LET THE ROBOT EXPLAIN
              </button>
              <button class="btn alt" id="stop">STOP</button>
              <button class="btn alt" id="vtog">PART VOICE: ON</button>
            </div>
            <div class="partbox" id="partbox">
              <b>Click a part</b>
              <div>
                Tap any piece of the model to see its name and what it does.
              </div>
            </div>
            <div class="chips" id="chips"></div>
            <div class="story" id="mstory"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/utlis.js"></script>
    <script src="js/sky.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/model3d.js"></script>
    <script src="js/story.js"></script>
    <script>
      /* 点击 PREV / NEXT 切换下一章时，自动滚回顶部看新的全屏视频 */
      ["stPrev", "stNext"].forEach(function (id) {
        var btn = document.getElementById(id);
        if (btn) {
          btn.addEventListener("click", function () {
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
        }
      });
    </script>
  </body>
</html>
